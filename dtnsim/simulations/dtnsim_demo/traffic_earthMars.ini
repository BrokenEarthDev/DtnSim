[General]
network = src.dtnsim
repeat = 1
dtnsim.node[*].dtn.sdrSize = 1024
sim-time-limit = 86400s
dtnsim.nodesNumber = 2
dtnsim.node[1].icon = "satellite"
dtnsim.node[2].icon = "satellite"
dtnsim.node[*].dtn.routing = "cgrModelRev17"
dtnsim.central.contactsFile = "contactPlan/cPlanEarthMars.txt"
dtnsim.node[*].dtn.routingType = "routeListType:allPaths-firstEnding,volumeAware:allContacts,extensionBlock:on,contactPlan:global"
dtnsim.node[*].dtn.printRoutingDebug = true

dtnsim.node[1].app.enable = true
dtnsim.node[1].app.bundlesNumber = "100"
dtnsim.node[1].app.start = "0"
dtnsim.node[1].app.destinationEid = "2"
dtnsim.node[1].app.size = "128"