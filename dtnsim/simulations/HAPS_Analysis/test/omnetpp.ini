[General]
allow-object-stealing-on-deletion = true
network = src.dtnsim
repeat = 1
sim-time-limit = 604801s
outputvectormanager-class="omnetpp::envir::SqliteOutputVectorManager"
outputscalarmanager-class="omnetpp::envir::SqliteOutputScalarManager"
**.vector-recording=false
result-dir = results
dtnsim.nodesNumber = 8
dtnsim.node[*].dtn.routing = "cgrModelRev17Distribution"
dtnsim.node[*].dtn.numHags = 2
dtnsim.node[*].dtn.MeanTTF = "1.05_1.05"
dtnsim.node[*].dtn.MeanTTR = "25_25"
dtnsim.node[*].dtn.routingType = "routeListType:allPaths-firstDepleted,volumeAware:allContacts,extensionBlock:on,contactPlan:local,distribution:weighted,sdrModel:perNode"
dtnsim.node[*].dtn.printRoutingDebug=true

dtnsim.central.contactsFile = "../FilteredContactPlans/test.txt"
dtnsim.node[8].app.enable=true
dtnsim.node[8].app.bundlesNumber="20"
dtnsim.node[8].app.start="0"
dtnsim.node[8].app.destinationEid="1"
dtnsim.node[8].app.size="100"


# Nodes's failure rates
dtnsim.node[2].fault.faultSeed = ${repetition}
dtnsim.node[2].fault.meanTTF = 1.05h
dtnsim.node[2].fault.meanTTR = 25h
dtnsim.node[4].fault.faultSeed = ${repetition}
dtnsim.node[4].fault.meanTTF = 1.05h
dtnsim.node[4].fault.meanTTR = 25h


dtnsim.node[2].fault.enable = true
dtnsim.node[4].fault.enable = true
